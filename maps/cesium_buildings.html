<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D-Gebäude (Cesium) - Platzhalter</title>
  <!-- CesiumJS (UNPKG) - evtl. eine andere Version wählen -->
  <link href="https://unpkg.com/cesium@1.100.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="https://unpkg.com/cesium@1.100.0/Build/Cesium/Cesium.js"></script>
  <style>html,body,#cesiumContainer{width:100%;height:100%;margin:0;padding:0;overflow:hidden} body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}</style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div style="position:absolute;left:12px;top:12px;z-index:999;background:rgba(255,255,255,0.9);padding:6px;border-radius:6px;border:1px solid rgba(0,0,0,0.06);font-size:0.9rem;">
    Hinweis: Tausche TILESET_URL mit der 3D‑Tiles-Tileset‑URL (z. B. Anbieter basemap.de) oder lade die offizielle Beispiel‑URL hierher.
  </div>
  <script>
    // Hinweis: Basemap.de bietet 3D-Gebäude als 3D-Tiles an. Um diese anzuzeigen,
    // setze die Variable TILESET_URL auf die vom Dienst bereitgestellte tileset.json-URL
    // Beispiel:
    // const TILESET_URL = 'https://example.com/tiles/tileset.json';
    // Wenn Du die echte URL von basemap.de hast, trage sie unten ein.

    const TILESET_URL = 'https://sgx.geodatenzentrum.de/gdz_basemapde_3d_gebaeude/lod2_4978_dgm5.json';

    // Initialize Cesium Viewer
    const viewer = new Cesium.Viewer('cesiumContainer', {
      timeline: false,
      animation: false,
      baseLayerPicker: true,
      geocoder: false,
      homeButton: true,
      sceneModePicker: true,
      navigationHelpButton: false,
      infoBox: false,
      shouldAnimate: true
    });

    if (!TILESET_URL) {
      console.warn('TILESET_URL ist leer. Bitte setze die tileset.json-URL in dieser Datei.');
      const el = document.createElement('div');
      el.style.position = 'absolute';
      el.style.left = '12px';
      el.style.bottom = '12px';
      el.style.zIndex = '999';
      el.style.background = 'rgba(255,255,255,0.9)';
      el.style.padding = '8px';
      el.style.border = '1px solid rgba(0,0,0,0.06)';
      el.style.borderRadius = '6px';
      el.style.fontSize = '0.9rem';
      el.textContent = 'TILESET_URL fehlt. Bitte öffne diese Datei und setze die tileset.json-URL vom Anbieter (z. B. basemap.de).';
      document.body.appendChild(el);
    } else {
      // Load 3D Tileset
      const tileset = new Cesium.Cesium3DTileset({ url: TILESET_URL });
      viewer.scene.primitives.add(tileset);
      tileset.readyPromise.then(function() {
        viewer.zoomTo(tileset);
      }).otherwise(function(error){
        console.error(error);
        alert('Fehler beim Laden des 3D-Tilesets. Siehe Konsole.');
      });
    }
  </script>
</body>
</html>
