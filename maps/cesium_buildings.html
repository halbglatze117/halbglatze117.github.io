<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D-Gebäude (Cesium) - Platzhalter</title>
  <!-- CesiumJS (UNPKG) - evtl. eine andere Version wählen -->
  <link href="https://unpkg.com/cesium@1.100.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="https://unpkg.com/cesium@1.100.0/Build/Cesium/Cesium.js"></script>
  <style>html,body,#cesiumContainer{width:100%;height:100%;margin:0;padding:0;overflow:hidden} body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}</style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <!-- Hinweis-Overlay: jetzt wird die tatsächlich verwendete URL angezeigt -->
  <div id="tilesetHint" style="position:absolute;left:12px;top:12px;z-index:999;background:rgba(255,255,255,0.95);padding:8px;border-radius:6px;border:1px solid rgba(0,0,0,0.06);font-size:0.9rem;max-width:60vw;line-height:1.3;">
    Hinweis: Dieses Beispiel lädt 3D-Gebäude über ein 3D-Tiles-Tileset. Verwendete tileset.json-URL:
    <div style="margin-top:6px;word-break:break-all;"><a id="tilesetLink" href="#" target="_blank" rel="noopener noreferrer">(Tileset-URL)</a></div>
  </div>
  <script>
    const TILESET_URL = 'https://sgx.geodatenzentrum.de/gdz_basemapde_3d_gebaeude/lod2_4978_dgm5.json';

    // Initialize Cesium Viewer
    const viewer = new Cesium.Viewer('cesiumContainer', {
      timeline: false,
      animation: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: true,
      sceneModePicker: true,
      navigationHelpButton: false,
      infoBox: false,
      shouldAnimate: true
    });

    // Add OpenStreetMap as a fallback base layer so viewer is not a black box
    try {
      // Remove default imagery and add OSM tiles
      viewer.imageryLayers.removeAll();
      viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
        url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        subdomains: ['a','b','c'],
        credit: '© OpenStreetMap contributors'
      }));
    } catch (e) {
      console.warn('Fehler beim Hinzufügen des OSM-Basiskarten-Layers:', e);
    }

    // Set an initial camera view (Germany overview)
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(10.0, 51.2, 500000) // lon, lat, height
    });

    // Update the hint overlay link to point to the actual tileset URL
    (function(){
      const link = document.getElementById('tilesetLink');
      if(link){
        link.href = TILESET_URL;
        link.textContent = TILESET_URL;
      }
    })();

    if (!TILESET_URL) {
      console.warn('TILESET_URL ist leer. Bitte setze die tileset.json-URL in dieser Datei.');
      const el = document.createElement('div');
      el.style.position = 'absolute';
      el.style.left = '12px';
      el.style.bottom = '12px';
      el.style.zIndex = '999';
      el.style.background = 'rgba(255,255,255,0.95)';
      el.style.padding = '8px';
      el.style.border = '1px solid rgba(0,0,0,0.06)';
      el.style.borderRadius = '6px';
      el.style.fontSize = '0.9rem';
      el.textContent = 'TILESET_URL fehlt. Bitte öffne diese Datei und setze die tileset.json-URL vom Anbieter (z. B. basemap.de).';
      document.body.appendChild(el);
    } else {
      // Load 3D Tileset
      const tileset = new Cesium.Cesium3DTileset({ url: TILESET_URL });
      viewer.scene.primitives.add(tileset);
      tileset.readyPromise.then(function() {
        // Zoom closer to tileset when ready
        viewer.zoomTo(tileset).otherwise(function(){
          // fallback: fly to default view
          viewer.camera.flyTo({destination: Cesium.Cartesian3.fromDegrees(10.0,51.2,2000)});
        });
      }).otherwise(function(error){
        console.error(error);
        const err = document.createElement('div');
        err.id = 'tilesetError';
        err.style.position = 'absolute';
        err.style.left = '12px';
        err.style.bottom = '12px';
        err.style.zIndex = '1000';
        err.style.background = 'rgba(255,230,230,0.98)';
        err.style.color = '#900';
        err.style.padding = '10px';
        err.style.border = '1px solid rgba(150,0,0,0.15)';
        err.style.borderRadius = '6px';
        err.style.maxWidth = '60vw';
        err.style.whiteSpace = 'pre-wrap';
        err.textContent = 'Fehler beim Laden des 3D-Tilesets.\nPrüfe die Entwickler-Konsole (Network/CORS).\n' + (error && error.message ? error.message : String(error));
        document.body.appendChild(err);
      });
    }
  </script>
</body>
</html>
